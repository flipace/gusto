version: '3.8'

services:
  gusto-chef:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # No ports - Coolify/Traefik handles routing
    expose:
      - "80"
    volumes:
      # Persist SQLite database
      - gusto-data:/var/www/html/api
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-https://gustochef.app}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_xxx}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_xxx}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gusto-data:
    driver: local
