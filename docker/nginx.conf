worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html index.php;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Customer App - default route
        location / {
            try_files $uri $uri/ /app/index.html;
        }

        # App routes
        location /app {
            alias /var/www/html/app;
            try_files $uri $uri/ /app/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API routes
        location /api {
            alias /var/www/html/api;
            try_files $uri $uri/ @api;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/html/api/index.php;
                include fastcgi_params;
            }
        }

        location @api {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/api/index.php;
            fastcgi_param PATH_INFO $uri;
            include fastcgi_params;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }

        location ~ \.(db|sqlite|sql|log|ini|conf)$ {
            deny all;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # PWA Service Worker
        location /sw.js {
            alias /var/www/html/app/sw.js;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        # PWA Manifest
        location /manifest.json {
            alias /var/www/html/app/manifest.json;
            add_header Cache-Control "no-cache";
        }

        # Redirect root to app
        location = / {
            return 301 /app/;
        }
    }
}
